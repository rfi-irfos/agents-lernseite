<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070c19" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/icons/192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Bis der Startbildschirm gebaut ist (main.ts setzt data-phase), bleibt alles unsichtbar: kein Nachspringen beim Laden. */
      #app:not([data-phase]) {
        visibility: hidden;
      }
    </style>
    <title>So arbeitet ein KI-Agent</title>
    <meta name="description" content="Schritt für Schritt erklärt: Wie ein KI-Agent eine Aufgabe versteht, plant, Werkzeuge nutzt und sein Ergebnis prüft." />
    <script>
      // Thema vor dem ersten Zeichnen setzen, damit nichts aufblitzt.
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('agents.theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body data-contrast-check>
    <div id="app">
      <div data-slot="fx"></div>
      <div data-slot="buehne"></div>
      <div data-slot="text" aria-live="polite"></div>
      <div data-slot="eingabe"></div>
      <div data-slot="steuerung">
        <!-- Der Themenschalter steht schon auf dem Startbildschirm; im Ablauf zieht er in die Steuerleiste um. -->
        <button type="button" class="glass ctl" data-action="theme" data-contrast-check></button>
      </div>
    </div>
    <script id="format-init">
      // Format vor dem ersten Zeichnen setzen (gleiche Schwellen wie src/engine/format.ts), damit das Layout nicht nachspringt.
      ;(function () {
        var r = innerWidth / innerHeight
        document.getElementById('app').dataset.format = r < 0.8 ? 'hoch' : r > 1.25 ? 'quer' : 'quadrat'
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
